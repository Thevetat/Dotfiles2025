    replace: "~/ai-tools"

  - trigger: "!hg"
    label: Garden
    replace: "~/Git/hermetica-garden/"

  - trigger: "!ok"
    label: okeanos
    replace: "~/Git/okeanos"

  - trigger: "!ae"
    label: aether
    replace: "~/Git/aethernet"

  - trigger: "!wa"
    label: waves
    replace: "~/Git/waves/"

  - trigger: "!ht"

[accessibility]
ui_scale = 1.20

[bar.default]
center = [ "media" ]
concave_edge_corners = true
end = [ "group:g1", "clock" ]
margin_edge = 0
margin_ends = 0
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
scale = 1.10
start = [ "workspaces", "active_window" ]
thickness = 35
widget_spacing = 9

    [[bar.default.capsule_group]]
    border = ""
    fill = "surface_variant"
    foreground = "on_surface_variant"
    id = "g1"
    members = [ "tray", "notifications", "bluetooth", "brightness", "network", "volume", "temp", "sysmon_2", "sysmon_3" ]
    opacity = 0.0
    padding = 0.0
    widget_spacing = 7

[shell]
clipboard_image_action_command = "satty -f -"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = false

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[idle]
pre_action_fade_seconds = 1.5

    [idle.behavior.screensaver]
    action = "command"
    command = "$HOME/.local/bin/hyprland-screensaver start"
    enabled = true
    resume_command = "$HOME/.local/bin/hyprland-screensaver stop"
    timeout = 300

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 900

[wallpaper]
directory = "/home/thevetat/Pictures/Wallpapers"

[theme]
custom_palette = "Tokyo Night Storm Soft"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-fruit-salad"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kcolorscheme", "qt" ]
    community_ids = [ "bat", "discord", "lazygit", "obsidian", "pi-agent", "spicetify", "steam", "telegram", "zen-browser" ]
    enable_builtin_templates = true
    enable_community_templates = true

        [theme.templates.user.ghostty]
        input_path = "$XDG_CONFIG_HOME/noctalia/templates/ghostty"
        output_path = "$XDG_CONFIG_HOME/ghostty/themes/noctalia"
        post_hook = "pkill -SIGUSR2 -x ghostty 2>/dev/null || true; if command -v herdr >/dev/null 2>&1 && herdr status server 2>/dev/null | grep -q '^status: running$'; then herdr server reload-config >/dev/null; fi"

        [theme.templates.user.hyprland]
        input_path = "$XDG_CONFIG_HOME/noctalia/templates/hyprland-colors.lua"
        output_path = "$XDG_STATE_HOME/noctalia/generated/hyprland-colors.lua"
        post_hook = "hyprctl reload"

        [theme.templates.user.neovim]
        input_path = "$XDG_CONFIG_HOME/noctalia/templates/nvim-base16.lua"
        output_path = "$XDG_STATE_HOME/noctalia/generated/nvim-base16.lua"
        post_hook = "pkill -SIGUSR1 -x nvim 2>/dev/null || true"

        [theme.templates.user.tmux]
        input_path = "$XDG_CONFIG_HOME/noctalia/templates/tmux-theme.conf"
        output_path = "$XDG_STATE_HOME/noctalia/generated/tmux-theme.conf"
        post_hook = "if tmux has-session 2>/dev/null; then tmux source-file ~/.tmux.conf; fi"

[widget.clock]
color = "on_surface_variant"
format = "{:%H:%M %-m/%-d}"

[widget.launcher]
color = "secondary"

[widget.media]
color = "on_surface"
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "on_surface_variant"
show_label = false

[widget.notifications]
color = "on_surface_variant"

[widget.session]
color = "error"

[widget.temp]
color = "on_surface_variant"
show_value = false

[widget.sysmon_2]
color = "on_surface_variant"
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
color = "on_surface_variant"
glyph = "cpu-2"
show_value = false
stat = "ram_used"
type = "sysmon"

[widget.tray]
capsule = false

[widget.volume]
color = "on_surface_variant"
show_label = false

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_fill = "surface_variant"
empty_color = "outline"
focused_color = "primary"
hide_when_empty = false
inactive_pill_size = 1.0
occupied_color = "on_surface_variant"
pill_scale = 0.80
show_labels = false
urgent_color = "error"

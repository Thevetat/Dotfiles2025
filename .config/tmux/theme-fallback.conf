# Tokyo Night Storm fallback for startup before Noctalia renders a palette.

set -g @noctalia_tmux_status_bg "#1f2335"
set -g @noctalia_tmux_surface "#414868"
set -g @noctalia_tmux_primary "#7aa2f7"
set -g @noctalia_tmux_secondary "#9ece6a"
set -g @noctalia_tmux_tertiary "#bb9af7"
set -g @noctalia_tmux_error "#f7768e"
set -g @noctalia_tmux_outline "#3b4261"

set -g status-style "bg=#1f2335"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
